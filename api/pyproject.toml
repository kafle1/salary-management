[project]
name = "salary-management-api"
version = "0.1.0"
description = "Salary management API for a 10,000 employee, multi-currency org"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
salary-admin = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # sqlite has no native decimal, sqlalchemy warns once per numeric column. tests round anyway.
    "ignore::sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Query() in a default is how fastapi declares parameters, the rule predates it
"app/api/routes.py" = ["B008"]
